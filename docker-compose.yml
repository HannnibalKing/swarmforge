version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: swarmforge-db
    environment:
      POSTGRES_DB: swarmforge
      POSTGRES_USER: swarmforge
      POSTGRES_PASSWORD: dev_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - swarmforge

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: swarmforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - swarmforge

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: swarmforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - swarmforge

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swarmforge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: swarmforge
      RABBITMQ_DEFAULT_PASS: dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - swarmforge

  # API Gateway (Go)
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: swarmforge-api-gateway
    environment:
      - DATABASE_URL=postgres://swarmforge:dev_password_change_in_prod@postgres:5432/swarmforge?sslmode=disable
      - REDIS_URL=redis:6379
      - JWT_SECRET=your-secret-key-change-in-prod
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - swarmforge
    volumes:
      - ./services/api-gateway:/app
    command: ["air", "-c", ".air.toml"]

  # Job Orchestrator (Go)
  job-orchestrator:
    build:
      context: ./services/job-orchestrator
      dockerfile: Dockerfile
    container_name: swarmforge-orchestrator
    environment:
      - DATABASE_URL=postgres://swarmforge:dev_password_change_in_prod@postgres:5432/swarmforge?sslmode=disable
      - REDIS_URL=redis:6379
      - RABBITMQ_URL=amqp://swarmforge:dev_password@rabbitmq:5672/
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - swarmforge
    volumes:
      - ./services/job-orchestrator:/app

  # Printer Service (Go)
  printer-service:
    build:
      context: ./services/printer-service
      dockerfile: Dockerfile
    container_name: swarmforge-printer-service
    environment:
      - DATABASE_URL=postgres://swarmforge:dev_password_change_in_prod@postgres:5432/swarmforge?sslmode=disable
      - REDIS_URL=redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - swarmforge
    volumes:
      - ./services/printer-service:/app

  # QA Service (Node.js/TypeScript)
  qa-service:
    build:
      context: ./services/qa-service
      dockerfile: Dockerfile
    container_name: swarmforge-qa-service
    environment:
      - DATABASE_URL=postgres://swarmforge:dev_password_change_in_prod@postgres:5432/swarmforge?sslmode=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - minio
    networks:
      - swarmforge
    volumes:
      - ./services/qa-service:/app
      - /app/node_modules

  # WebSocket Server (Node.js)
  websocket-server:
    build:
      context: ./services/websocket-server
      dockerfile: Dockerfile
    container_name: swarmforge-ws
    environment:
      - REDIS_URL=redis:6379
    ports:
      - "3002:3002"
    depends_on:
      - redis
    networks:
      - swarmforge
    volumes:
      - ./services/websocket-server:/app
      - /app/node_modules

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: swarmforge-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:3002
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - swarmforge
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:

networks:
  swarmforge:
    driver: bridge
